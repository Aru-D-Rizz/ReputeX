apiVersion: v1
kind: ConfigMap
metadata:
  name: reputex-backend-config
  namespace: reputex
  labels:
    app.kubernetes.io/name: reputex-backend
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: reputex
data:
  PORT: "5000"
  NODE_ENV: "production"
  OPENROUTER_MODEL: "nvidia/nemotron-3-ultra-550b-a55b:free"
  OPENROUTER_API_URL: "https://openrouter.ai/api/v1/chat/completions"
  ALLOWED_ORIGINS: "https://reputex.vercel.app,https://reputex-*.vercel.app,http://localhost:3000"
